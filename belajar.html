<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar - Bedul</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:sans-serif; background:#050505; color:#fff; max-width:430px; margin:0 auto; padding:16px;">

  <p style="font-size:10px; color:#d4af37; font-weight:bold; letter-spacing:2px;">BELAJAR • MURID</p>
  <h1 style="font-size:28px; margin:5px 0 15px;">Belajar, <span style="color:#d4af37;">Bedul</span></h1>

  <div id="materiUtama" style="background:#d4af37; color:#000; border-radius:20px; padding:18px;"><p>Memuat...</p></div>
  <h3 style="margin-top:20px;">Materi Lainnya</h3>
  <div id="listMateri" style="display:flex; flex-direction:column; gap:10px;"></div>

  <!-- POPUP MATERI -->
  <div id="popup" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); padding:16px; z-index:99; overflow-y:auto;">
    <div style="background:#141414; border-radius:20px; padding:20px; max-width:400px; margin:20px auto;">
      <div id="popupIsi"></div>
      <button onclick="mulaiSoal()" style="width:100%; margin-top:15px; padding:13px; border:none; border-radius:12px; background:#d4af37; font-weight:bold; cursor:pointer;">Kerjakan Soal →</button>
      <button onclick="tutupPopup()" style="width:100%; margin-top:8px; padding:12px; border:1px solid #333; border-radius:12px; background:transparent; color:#fff; cursor:pointer;">← Kembali</button>
    </div>
  </div>

  <!-- POPUP SOAL -->
  <div id="popupSoal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#050505; padding:16px; z-index:100; overflow-y:auto;">
    <div style="max-width:400px; margin:0 auto;">
      <p id="soalProgress" style="font-size:12px; color:#d4af37;"></p>
      <h2 id="soalTanya" style="line-height:1.5;"></h2>
      <div id="soalPilihan" style="display:flex; flex-direction:column; gap:10px; margin-top:15px;"></div>
      <button onclick="tutupSoal()" style="width:100%; margin-top:20px; padding:12px; background:transparent; color:#aaa; border:1px solid #333; border-radius:12px;">Batal</button>
    </div>
  </div>

  <!-- POPUP NILAI -->
  <div id="popupNilai" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); padding:16px; z-index:101;">
    <div style="background:#d4af37; color:#000; border-radius:20px; padding:25px; max-width:360px; margin:60px auto; text-align:center;">
      <p style="font-size:12px; font-weight:bold;">SELESAI!</p>
      <h1 id="nilaiBesar" style="font-size:60px; margin:10px 0;">0</h1>
      <p id="nilaiPesan"></p>
      <button onclick="selesaiSemua()" style="width:100%; margin-top:15px; padding:13px; border:none; border-radius:12px; background:#000; color:#d4af37; font-weight:bold;">Selesai ✓</button>
    </div>
  </div>

<script>
const supabaseClient = window.supabase.createClient("https://rotxnwbrnbwbscihvafq.supabase.co", "sb_publishable_a-oUmMa2TdwiWO_hbZ07eA_8F93XM81");
let semuaMateri = [];
let materiAktif = null;
let listSoal = [];
let indexSoal = 0;
let benar = 0;

function bukaMateri(id){
  const m = semuaMateri.find(x=>x.id===id);
  materiAktif = m;
  document.getElementById('popupIsi').innerHTML = `
    <p style="font-size:11px; color:#d4af37; font-weight:bold;">${m.mapel} • ${m.durasi}</p>
    <h2>${m.judul}</h2><p style="font-size:12px; color:#aaa;">Oleh ${m.guru}</p>
    <hr style="border:1px solid #333; margin:15px 0;">
    <p style="line-height:1.7; white-space:pre-wrap;">${m.isi}</p>`;
  document.getElementById('popup').style.display = 'block';
}
function tutupPopup(){ document.getElementById('popup').style.display='none'; }
function tutupSoal(){ document.getElementById('popupSoal').style.display='none'; }
function selesaiSemua(){ document.getElementById('popupNilai').style.display='none'; document.getElementById('popup').style.display='none'; document.getElementById('popupSoal').style.display='none'; }

async function mulaiSoal(){
  document.getElementById('popup').style.display='none';
  const { data } = await supabaseClient.from('soal').select('*').eq('materi_id', materiAktif.id).order('id');
  if(!data || data.length===0){ alert('Belum ada soal untuk materi ini'); return; }
  listSoal = data; indexSoal = 0; benar = 0;
  tampilSoal();
  document.getElementById('popupSoal').style.display='block';
}
function tampilSoal(){
  const s = listSoal[indexSoal];
  document.getElementById('soalProgress').innerText = `Soal ${indexSoal+1} dari ${listSoal.length}`;
  document.getElementById('soalTanya').innerText = s.pertanyaan;
  const pilihan = [['A',s.pilihan_a],['B',s.pilihan_b],['C',s.pilihan_c],['D',s.pilihan_d]];
  document.getElementById('soalPilihan').innerHTML = pilihan.map(p=>`
    <button onclick="jawabSoal('${p[0]}')" style="text-align:left; padding:15px; background:#141414; color:#fff; border:1px solid #333; border-radius:14px; cursor:pointer;">
    <b style="color:#d4af37;">${p[0]}.</b> ${p[1]}</button>`).join('');
}
async function jawabSoal(pilih){
  const s = listSoal[indexSoal];
  if(pilih === s.jawaban_benar) benar++;
  indexSoal++;
  if(indexSoal < listSoal.length){ tampilSoal(); }
  else {
    document.getElementById('popupSoal').style.display='none';
    const nilai = Math.round((benar / listSoal.length) * 100);
    document.getElementById('nilaiBesar').innerText = nilai;
    document.getElementById('nilaiPesan').innerText = nilai===100 ? 'Sempurna! Lu jago banget!' : nilai>=70 ? 'Bagus! Dikit lagi sempurna.' : 'Gpp, belajar lagi yuk!';
    document.getElementById('popupNilai').style.display='block';
    await supabaseClient.from('nilai').insert([{nama:'Bedul', materi_id: materiAktif.id, nilai: nilai}]);
  }
}
async function loadMateri(){
  const { data } = await supabaseClient.from('materi').select('*').order('id',{ascending:false});
  if(!data || data.length===0){ document.getElementById('materiUtama').innerHTML=`<p><b>Belum ada materi</b></p>`; return; }
  semuaMateri = data;
  const m = data[0];
  document.getElementById('materiUtama').innerHTML = `
    <div onclick="bukaMateri(${m.id})" style="cursor:pointer;">
      <p style="font-size:11px; font-weight:bold;">${m.mapel} • ${m.durasi}</p>
      <h2 style="margin:8px 0;">${m.judul}</h2>
      <p style="font-size:13px; opacity:0.7;">Oleh ${m.guru}</p>
      <p style="margin-top:12px;">${m.isi.substring(0,80)}...</p>
      <div style="margin-top:15px; background:#000; color:#d4af37; text-align:center; padding:12px; border-radius:12px; font-weight:bold;">Mulai Belajar →</div>
    </div>`;
  document.getElementById('listMateri').innerHTML = data.map(x=>`
    <div onclick="bukaMateri(${x.id})" style="background:#141414; border:1px solid #222; padding:14px; border-radius:14px; cursor:pointer;">
      <b>${x.judul}</b><br><span style="font-size:11px; color:#aaa;">${x.mapel} • ${x.guru} • ${x.durasi}</span>
      <div style="text-align:right; color:#d4af37; font-size:12px;">Lihat →</div>
    </div>`).join('');
}
loadMateri();
</script>
</body>
</html>
