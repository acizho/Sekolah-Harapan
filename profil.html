<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profil Siswa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;text-align:center}
.box h1{color:#e8c97a;letter-spacing:4px;font-size:22px}
.box p{color:#aaa;font-size:13px;margin:10px 0 22px}
input{width:100%;background:#111;border:1px solid #d4af37;color:#fff;padding:15px;border-radius:14px;font-size:18px;text-align:center;outline:none;margin-bottom:12px;letter-spacing:6px}
button{width:100%;background:linear-gradient(180deg,#f5d67b,#d4af37,#a8831d);border:none;padding:15px;border-radius:999px;font-weight:900;font-size:18px;cursor:pointer;margin-bottom:10px}
.back{background:#222;color:#fff;border:1px solid #444}
#err{color:#ff6b6b;font-size:13px;margin-top:6px;display:none}
label{display:block;text-align:left;color:#e8c97a;font-size:13px;font-weight:700;margin-bottom:6px}
.kembali{font-size:13px;color:#aaa;cursor:pointer;margin-top:8px}
.card{background:#111;border:1px solid #d4af37;border-radius:14px;padding:16px;text-align:left;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #333;font-size:14px}
.row:last-child{border-bottom:none}
.row b{color:#e8c97a}
.row span{text-align:right;max-width:60%;word-break:break-all}
.foto{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid #d4af37;margin:0 auto 12px;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;font-size:45px}
.foto img{width:100%;height:100%;object-fit:cover}
.jadwal-item{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:10px 12px;margin-bottom:8px;text-align:left;font-size:13px;display:flex;justify-content:space-between}
.jadwal-item b{color:#fff}
.jadwal-item span{color:#e8c97a}
</style></head><body>
<div class="box">

<!-- ============ 1. FORM LOGIN - ADA DI DALEM profil.html ============ -->
<div id="loginBox" style="display:none">
<div style="font-size:60px">🎓</div><h1>LOGIN SISWA</h1><p id="sub">Masukkan NIS kamu</p>
<div id="step1">
<label>NIS</label>
<input id="nis" placeholder="202401234" inputmode="numeric">
<button onclick="cekNis()">LANJUT ➜</button>
</div>
<div id="step2" style="display:none">
<label>MASUKKAN PIN 6 DIGIT</label>
<p id="namaKetemu" style="color:#e8c97a;font-size:14px;margin-bottom:12px"></p>
<input id="pin" placeholder="••••••" maxlength="6" inputmode="numeric" type="password">
<button onclick="loginPin()">MASUK ➜</button>
<div class="kembali" onclick="keStep1()">⬅ Ganti NIS</div>
</div>
<div id="err"></div>
</div>

<!-- ============ 2. PROFIL - MUNCUL KALAU UDAH LOGIN ============ -->
<div id="profilBox" style="display:none">
<div class="foto" id="fotoBox">🎓</div>
<h1 id="namaBesar">Memuat...</h1>
<p id="nisTampil">NIS : -</p>
<div class="card">
<label>DATA DIRI</label>
<div class="row"><b>Kelas</b><span id="kelas">-</span></div>
<div class="row"><b>Mapel Favorit</b><span id="mapel">-</span></div>
<div class="row"><b>WA</b><span id="wa">-</span></div>
<div class="row"><b>Alamat</b><span id="alamat">-</span></div>
<div class="row"><b>Status</b><span id="status">-</span></div>
</div>
<div class="card" id="jadwalCard" style="display:none">
<label>JADWAL / MAPEL BESOK</label>
<div id="jadwalList"></div>
</div>
<button onclick="location.href='index.html'">🏫 LIHAT GEDUNG ➜</button>
<button class="back" onclick="logout()">⬅ Logout</button>
</div>

</div>

<script>
const SUPABASE_URL = "https://rotxnwbrnbwbscihvafq.supabase.co/rest/v1";
const SUPABASE_KEY = "sb_publishable_a-oUmMa2TdwiWO_hbZ07eA_8F93XM81";
let nisValid = "";
let DATA_PROFIL = null;

// ===== CEK AWAL: UDAH LOGIN APA BELUM? =====
let nisLogin = localStorage.getItem('nis_login');
if(!nisLogin){
  // Belum login -> TAMPILIN FORM LOGIN DI HALAMAN INI JUGA, GAK PINDAH!
  document.getElementById('loginBox').style.display='block';
} else {
  // Udah login -> LANGSUNG TAMPILIN PROFIL
  document.getElementById('profilBox').style.display='block';
  ambilDariSupabase();
}

function showErr(m){ let e=document.getElementById('err'); e.innerText=m; e.style.display='block'; }
function hideErr(){ document.getElementById('err').style.display='none'; }

async function cekNis(){
  let nis = document.getElementById('nis').value.trim();
  if(!nis) return alert("Isi NIS dulu!");
  hideErr();
  let r = await fetch(SUPABASE_URL + "/murid?select=nama,nis&nis=eq." + nis, {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
  let data = await r.json();
  if(data.length===0){ showErr("❌ NIS tidak ditemukan!"); return; }
  nisValid = nis;
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('sub').innerText = "NIS ditemukan!";
  document.getElementById('namaKetemu').innerText = "Halo, " + data[0].nama + " 👋";
  document.getElementById('pin').focus();
}

async function loginPin(){
  let pin = document.getElementById('pin').value.trim();
  if(pin.length!==6){ showErr("❌ PIN harus 6 digit!"); return; }
  let r = await fetch(SUPABASE_URL + "/murid?select=*&nis=eq." + nisValid + "&pin=eq." + pin, {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
  let data = await r.json();
  if(data.length===0){ showErr("❌ PIN salah!"); return; }
  // Simpen, terus LANGSUNG GANTI TAMPILAN KE PROFIL, GAK PINDAH FILE!
  localStorage.setItem('nis_login', nisValid);
  localStorage.setItem('nama_login', data[0].nama);
  document.getElementById('loginBox').style.display='none';
  document.getElementById('profilBox').style.display='block';
  nisLogin = nisValid;
  ambilDariSupabase();
}

function keStep1(){ document.getElementById('step2').style.display='none'; document.getElementById('step1').style.display='block'; document.getElementById('sub').innerText="Masukkan NIS kamu"; hideErr(); }

async function ambilDariSupabase(){
  try{
    // ✅ Pake nis=eq. + NIS login, BUKAN limit=1!
    let r1 = await fetch(SUPABASE_URL + "/murid?select=*&nis=eq." + nisLogin, {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
    let a1 = await r1.json();
    DATA_PROFIL = a1[0];
    if(!DATA_PROFIL){ alert("Data tidak ditemukan"); logout(); return; }
    tampilProfil();
    let r2 = await fetch(SUPABASE_URL + "/jadwal?select=*&order=jam", {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
    let DATA_JADWAL = await r2.json();
    if(DATA_JADWAL && DATA_JADWAL.length > 0){
      let html = "";
      DATA_JADWAL.forEach(j=>{ html += '<div class="jadwal-item"><b>'+(j.mapel || j.nama || '-')+'</b><span>'+(j.jam || '')+' '+(j.hari || '')+'</span></div>'; });
      document.getElementById('jadwalList').innerHTML = html;
      document.getElementById('jadwalCard').style.display='block';
    }
  }catch(e){ document.getElementById('namaBesar').innerText = "Gagal load database"; }
}

function tampilProfil(){
  let m = DATA_PROFIL;
  document.getElementById('namaBesar').innerText = m.nama || "-";
  document.getElementById('nisTampil').innerText = "NIS : " + m.nis;
  document.getElementById('kelas').innerText = m.kelas || "-";
  document.getElementById('mapel').innerText = m.mapel_favorit || "-";
  document.getElementById('wa').innerText = m.wa || "-";
  document.getElementById('alamat').innerText = m.alamat || "-";
  document.getElementById('status').innerText = m.status || "-";
  if(m.foto){ document.getElementById('fotoBox').innerHTML = '<img src="'+m.foto+'">'; }
}

function logout(){
  localStorage.removeItem('nis_login');
  localStorage.removeItem('nama_login');
  // Balik lagi ke FORM LOGIN DI HALAMAN YANG SAMA, GAK PINDAH!
  document.getElementById('profilBox').style.display='none';
  document.getElementById('loginBox').style.display='block';
  keStep1();
  document.getElementById('nis').value = "";
  document.getElementById('pin').value = "";
}
</script>
</body></html>
