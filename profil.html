<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Siswa - Luxury</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#000;color:#fff;min-height:100vh;padding:22px 16px 40px;background-image:radial-gradient(circle at 15% 10%, rgba(212,175,55,.22) 0%, transparent 40%),radial-gradient(circle at 90% 60%, rgba(212,175,55,.18) 0%, transparent 45%),linear-gradient(180deg,#14100a,#000 45%,#000)}
.header{text-align:center}
.header h1{color:#e8c97a;font-size:22px;letter-spacing:5px;font-weight:400}
.garis{width:180px;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:12px auto;position:relative}
.garis::after{content:"◆";position:absolute;left:50%;top:-8px;transform:translateX(-50%);color:#d4af37;font-size:10px;background:#000;padding:0 6px}
.foto{width:170px;height:170px;margin:22px auto 20px;border-radius:50%;border:4px solid #e8c97a;box-shadow:0 0 0 3px #7a5f1a,0 0 30px rgba(212,175,55,.6),inset 0 0 20px rgba(0,0,0,.7);background:radial-gradient(circle at 50% 35%, #2a2415, #000);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.foto span{font-size:70px}
.row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.7);border-radius:14px;padding:13px 15px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.row .icon{font-size:28px;width:38px;text-align:center}
.row .txt{flex:1}
.row .txt label{display:block;color:#e8c97a;font-size:15px;font-weight:700}
.row .txt div{color:#fff;font-size:14px;width:100%;padding:2px 0;word-break:break-all}
.btn{width:100%;margin-top:8px;background:linear-gradient(180deg,#f5d67b,#d4af37,#a8831d);color:#000;border:none;padding:15px;border-radius:999px;font-weight:900;font-size:20px;letter-spacing:2px;cursor:pointer;box-shadow:0 10px 25px rgba(212,175,55,.4)}
.back{width:100%;margin-top:12px;background:transparent;border:1px solid #555;color:#aaa;padding:12px;border-radius:999px;cursor:pointer}
#err{color:#ff6b6b;font-size:13px;margin-top:6px;display:none;text-align:center}
/* ===== TOMBOL GESER CEK PPDB / MASUK ===== */
.toggle-wrap{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(212,175,55,.7);border-radius:999px;padding:4px;margin:6px 0 22px;position:relative}
.toggle-wrap button{flex:1;border:none;background:transparent;color:#aaa;padding:12px;border-radius:999px;font-weight:800;font-size:14px;letter-spacing:1px;cursor:pointer;position:relative;z-index:2;transition:.25s}
.toggle-wrap button.active{background:linear-gradient(180deg,#f5d67b,#d4af37);color:#000;box-shadow:0 5px 15px rgba(212,175,55,.5)}
label.login-label{display:block;text-align:left;color:#e8c97a;font-size:13px;font-weight:700;margin-bottom:6px}
input.login-input{width:100%;background:#111;border:1px solid #d4af37;color:#fff;padding:15px;border-radius:14px;font-size:18px;text-align:center;outline:none;margin-bottom:12px;letter-spacing:1px}
input.login-input::placeholder{color:#666;letter-spacing:0}
/* ===== HASIL CEK PPDB ===== */
#hasilCek{display:none;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.7);border-radius:16px;padding:16px;margin-top:16px;text-align:left}
#hasilCek h3{color:#e8c97a;font-size:16px;margin-bottom:10px;text-align:center}
#hasilCek p{font-size:14px;line-height:1.8;color:#ddd}
#hasilCek b{color:#fff}
.badge-status{display:inline-block;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:10px}
.st-lolos{background:#14532d;color:#4ade80}
.st-tunggu{background:#422006;color:#fbbf24}
.st-tolak{background:#7f1d1d;color:#fca5a5}
</style>
</head>
<body>

<!-- ========== 1. FORM GESER: CEK PPDB / MASUK ========== -->
<div id="loginBox" style="display:none;max-width:380px;margin:0 auto;text-align:center">
<div style="font-size:60px">🎓</div>
<div class="header"><h1>PROFIL SISWA</h1><div class="garis"></div></div>

<!-- TOMBOL GESER -->
<div class="toggle-wrap">
<button id="btnCek" class="active" onclick="gantiMode('cek')">CEK PPDB</button>
<button id="btnMasuk" onclick="gantiMode('masuk')">MASUK</button>
</div>

<!-- MODE: CEK PPDB (DEFAULT) -->
<div id="modeCek">
<label class="login-label">Nomor Pendaftaran</label>
<input class="login-input" id="noPendaftaran" placeholder="PPDB-2026-0001">
<label class="login-label">Nomor KK</label>
<input class="login-input" id="noKK" placeholder="16 Digit Nomor KK" inputmode="numeric" maxlength="16">
<button class="btn" onclick="cekPPDB()">CEK PPDB ➜</button>
<div id="err"></div>
<!-- KETERANGAN HASIL CEK -->
<div id="hasilCek"></div>
</div>

<!-- MODE: MASUK (NIS) -->
<div id="modeMasuk" style="display:none">
<label class="login-label">NIS</label>
<input class="login-input" id="nis" placeholder="20260101" inputmode="numeric">
<button class="btn" onclick="cekNis()">MASUK ➜</button>
<div id="err2"></div>
</div>

</div>

<!-- ========== 2. PROFIL SISWA ========== -->
<div id="profilBox" style="display:none;max-width:420px;margin:0 auto">
<div class="header"><h1>PROFIL SISWA</h1><div class="garis"></div></div>
<div class="foto">
<span id="emojiFoto">🎓</span>
<img id="imgFoto" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
</div>
<div class="row"><div class="icon">👤</div><div class="txt"><label>Nama:</label><div id="fNama">-</div></div></div>
<div class="row"><div class="icon">🪪</div><div class="txt"><label>NIS:</label><div id="fNip">-</div></div></div>
<div class="row"><div class="icon">🧾</div><div class="txt"><label>No. Pendaftaran:</label><div id="fNoPendaftaran">-</div></div></div>
<div class="row"><div class="icon">🎓</div><div class="txt"><label>Kelas:</label><div id="fKelas">-</div></div></div>
<div class="row"><div class="icon">👦👧</div><div class="txt"><label>Jenis Kelamin:</label><div id="fJk">-</div></div></div>
<div class="row"><div class="icon">🎂</div><div class="txt"><label>Tanggal Lahir:</label><div id="fTgl">-</div></div></div>
<div class="row"><div class="icon">📍</div><div class="txt"><label>Alamat:</label><div id="fAlamat">-</div></div></div>
<div class="row"><div class="icon">👨‍👩‍👧</div><div class="txt"><label>Orang Tua:</label><div id="fOrtu">-</div></div></div>
<div class="row"><div class="icon">📞</div><div class="txt"><label>No WA Orang Tua:</label><div id="fWaOrtu">-</div></div></div>
<div class="row"><div class="icon">☀️</div><div class="txt"><label>Status:</label><div id="fStatus">-</div></div></div>
<button class="btn" onclick="location.href='index.html'">🏫 LIHAT GEDUNG ➜</button>
<button class="back" onclick="logout()">⬅ Logout</button>
</div>

<script>
const SUPABASE_URL = "https://rotxnwbrnbwbscihvafq.supabase.co/rest/v1";
const SUPABASE_KEY = "sb_publishable_a-oUmMa2TdwiWO_hbZ07eA_8F93XM81";
let nisLogin = localStorage.getItem('nis_login');

if(!nisLogin){
  document.getElementById('loginBox').style.display='block';
  gantiMode('cek');
} else {
  document.getElementById('profilBox').style.display='block';
  ambilDariSupabase();
}

// ===== GANTI MODE GESER =====
function gantiMode(mode){
  document.getElementById('btnCek').classList.toggle('active', mode==='cek');
  document.getElementById('btnMasuk').classList.toggle('active', mode==='masuk');
  document.getElementById('modeCek').style.display = mode==='cek' ? 'block' : 'none';
  document.getElementById('modeMasuk').style.display = mode==='masuk' ? 'block' : 'none';
  document.getElementById('hasilCek').style.display='none';
  let e=document.getElementById('err'); if(e) e.style.display='none';
  let e2=document.getElementById('err2'); if(e2) e2.style.display='none';
}

function showErr(m, id='err'){ let e=document.getElementById(id); e.innerText=m; e.style.display='block'; }

// ===== CEK PPDB: No Pendaftaran + No KK =====
async function cekPPDB(){
  let noP = document.getElementById('noPendaftaran').value.trim();
  let noKK = document.getElementById('noKK').value.trim();
  let box = document.getElementById('hasilCek');
  if(!noP || !noKK){ showErr("❌ Isi Nomor Pendaftaran & Nomor KK dulu!"); return; }
  document.getElementById('err').style.display='none';
  box.innerHTML = '<p style="text-align:center;color:#aaa">⏳ Mengecek...</p>'; box.style.display='block';

  try{
    // Coba cari pakai no_pendaftaran + no_kk
    let r = await fetch(SUPABASE_URL + "/siswa?select=*,kelas(nama_kelas)&no_pendaftaran=eq." + encodeURIComponent(noP), {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
    let data = await r.json();
    // Fallback: kalau kolom no_pendaftaran belum ada di DB, cari pakai no_akta / nis sebagai nomor pendaftaran
    if(!data || data.length===0){
      let r2 = await fetch(SUPABASE_URL + "/siswa?select=*,kelas(nama_kelas)&no_akta=eq." + encodeURIComponent(noP), {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
      data = await r2.json();
    }
    if(!data || data.length===0){
      box.innerHTML = '<h3>❌ Tidak Ditemukan</h3><p style="text-align:center">Nomor Pendaftaran tidak ditemukan.<br>Cek lagi nomornya atau hubungi admin.</p>';
      return;
    }
    let m = data[0];
    // Cocokkan No KK - cek kolom no_kk, kalau belum ada pakai no_akta sebagai pembanding
    let kkDB = String(m.no_kk || m.no_akta || '').replace(/\D/g,'');
    let kkInput = String(noKK).replace(/\D/g,'');
    if(kkDB && kkDB !== kkInput){
      box.innerHTML = '<h3>❌ Nomor KK Tidak Cocok</h3><p style="text-align:center">Nomor KK tidak cocok dengan Nomor Pendaftaran ini.<br>Cek lagi 16 digit Nomor KK kamu.</p>';
      return;
    }
    // KETERANGAN - tampilkan semua dari database
    let status = m.status || 'Menunggu';
    let badge = '', judul='', pesan='', tombol='';
    if(status==='Aktif'){
      badge='<span class="badge-status st-lolos">🟢 LOLOS - DITERIMA</span>';
      judul='Selamat! Kamu Diterima 🎉';
      pesan=`Kamu resmi jadi siswa SMA Negeri 1 Harapan.`;
      tombol = m.nis ? `<button class="btn" onclick="masukDariPPDB('${m.nis}')">LIHAT PROFIL ➜</button>` : '';
    } else if(status==='Ditolak'){
      badge='<span class="badge-status st-tolak">🔴 DITOLAK</span>';
      judul='Mohon Maaf Belum Lolos';
      pesan=`Pendaftaranmu belum lolos verifikasi PPDB. Silakan hubungi admin untuk info lebih lanjut.`;
    } else {
      badge='<span class="badge-status st-tunggu">🟡 MENUNGGU</span>';
      judul='Masih Dalam Antrian';
      pesan=`Pendaftaranmu sedang diverifikasi panitia. Cek lagi berkala ya.`;
    }
    box.innerHTML = `
      <div style="text-align:center">${badge}<h3>${judul}</h3><p style="text-align:center;color:#aaa">${pesan}</p></div>
      <p><b>Nama:</b> ${m.nama||'-'}</p>
      <p><b>No. Pendaftaran:</b> ${m.no_pendaftaran||noP}</p>
      <p><b>No. KK:</b> ${m.no_kk||'****'+String(noKK).slice(-4)}</p>
      <p><b>Gelombang:</b> ${m.gelombang||'-'}</p>
      <p><b>Nilai Rapor:</b> ${m.nilai_rapor ?? '-'}</p>
      <p><b>Tanggal Lahir:</b> ${m.tanggal_lahir||'-'}</p>
      <p><b>Jenis Kelamin:</b> ${m.jenis_kelamin==='L'?'Laki-laki':m.jenis_kelamin==='P'?'Perempuan':(m.jenis_kelamin||'-')}</p>
      <p><b>Orang Tua:</b> ${m.nama_orang_tua||'-'}</p>
      <p><b>Status:</b> ${status}</p>
      ${status==='Aktif' ? `<p><b>NIS:</b> ${m.nis||'-'}</p><p><b>Kelas:</b> ${(m.kelas && m.kelas.nama_kelas) ? m.kelas.nama_kelas : 'Belum ada kelas - hubungi admin'}</p>` : ''}
      ${tombol}
    `;
  }catch(e){ box.innerHTML='<p style="text-align:center">❌ Gagal mengecek. Cek koneksi internet.</p>'; console.log(e); }
}

// Kalau sudah LOLOS, langsung masuk ke profil pakai NIS-nya
function masukDariPPDB(nis){
  localStorage.setItem('nis_login', nis);
  document.getElementById('loginBox').style.display='none';
  document.getElementById('profilBox').style.display='block';
  nisLogin = nis;
  ambilDariSupabase();
}

// ===== MASUK: pakai NIS (fungsi lama, tetap jalan) =====
async function cekNis(){
  let nis = document.getElementById('nis').value.trim();
  if(!nis) return alert("Isi NIS dulu!");
  let r = await fetch(SUPABASE_URL + "/siswa?select=*,kelas(nama_kelas)&nis=eq." + nis, {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
  let data = await r.json();
  if(!data || data.length===0){ showErr("❌ NIS tidak ditemukan!", 'err2'); return; }
  localStorage.setItem('nis_login', nis);
  localStorage.setItem('nama_login', data[0].nama);
  document.getElementById('loginBox').style.display='none';
  document.getElementById('profilBox').style.display='block';
  nisLogin = nis;
  ambilDariSupabase();
}

async function ambilDariSupabase(){
  try{
    let r = await fetch(SUPABASE_URL + "/siswa?select=*,kelas(nama_kelas)&nis=eq." + nisLogin, {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
    let data = await r.json();
    let m = data[0];
    if(!m){ alert("Data tidak ditemukan"); logout(); return; }
    document.getElementById('fNama').innerText = m.nama || "-";
    document.getElementById('fNip').innerText = m.nis || "-";
    document.getElementById('fNoPendaftaran').innerText = m.no_pendaftaran || "-";
    document.getElementById('fKelas').innerText = (m.kelas && m.kelas.nama_kelas) ? m.kelas.nama_kelas : "-";
    document.getElementById('fJk').innerText = m.jenis_kelamin === 'L' ? 'Laki-laki' : m.jenis_kelamin === 'P' ? 'Perempuan' : (m.jenis_kelamin || "-");
    document.getElementById('fTgl').innerText = m.tanggal_lahir || "-";
    document.getElementById('fAlamat').innerText = m.alamat || "-";
    document.getElementById('fOrtu').innerText = m.nama_orang_tua || "-";
    document.getElementById('fWaOrtu').innerText = m.no_wa_orang_tua || "-";
    document.getElementById('fStatus').innerText = m.status || "-";
    if(m.foto_url){
      let im=document.getElementById('imgFoto'); im.src=m.foto_url; im.style.display='block';
      document.getElementById('emojiFoto').style.display='none';
    }
  }catch(e){ console.log(e); }
}

function logout(){
  localStorage.removeItem('nis_login');
  localStorage.removeItem('nama_login');
  location.href = 'index.html';
}
</script>
</body>
</html>
