<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profil Siswa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px;text-align:center}
.foto{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #d4af37;margin:0 auto 14px;background:#111;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
h1{color:#e8c97a;letter-spacing:3px;font-size:22px}
.sub{color:#aaa;font-size:13px;margin:8px 0 20px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:16px;text-align:left;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #333;font-size:14px}
.row:last-child{border-bottom:none}
.row b{color:#e8c97a}
.row span{text-align:right;color:#fff;max-width:60%;word-break:break-all}
button{width:100%;background:linear-gradient(180deg,#f5d67b,#d4af37,#a8831d);border:none;padding:15px;border-radius:999px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px;color:#000}
.btn2{background:#222;color:#fff;border:1px solid #444;margin-top:8px}
#loading{color:#aaa;font-size:13px;margin-top:20px}
</style></head><body>
<div class="box">
<div class="foto" id="fotoBox">🎓</div>
<h1 id="nama">Memuat...</h1>
<p class="sub" id="nisTampil">NIS : -</p>

<div id="loading">Mengambil data dari Supabase...</div>

<div id="isi" style="display:none">
<div class="card">
<div class="row"><b>Kelas</b><span id="kelas">-</span></div>
<div class="row"><b>Mapel Favorit</b><span id="mapel">-</span></div>
<div class="row"><b>WA</b><span id="wa">-</span></div>
<div class="row"><b>Alamat</b><span id="alamat">-</span></div>
<div class="row"><b>Status</b><span id="status">-</span></div>
</div>
<button onclick="logout()">KELUAR ➜</button>
<button class="btn2" onclick="location.href='index.html'">⬅ Kembali ke Beranda</button>
</div>
</div>

<script>
const SUPABASE_URL = "https://rotxnwbrnbwbscihvafq.supabase.co/rest/v1";
const SUPABASE_KEY = "sb_publishable_a-oUmMa2TdwiWO_hbZ07eA_8F93XM81";

// 1. CEK LOGIN - HARUS SAMA PERSIS KAYAK DI login.html: 'nis_login'
let nis = localStorage.getItem('nis_login');

if(!nis){
  // Kalau gak ada, baru mental ke login. Kalau ada, LANJUT!
  location.href = 'login.html';
} else {
  loadProfil();
}

async function loadProfil(){
  try{
    let r = await fetch(SUPABASE_URL + "/murid?select=*&nis=eq." + nis, {
      headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}
    });
    let data = await r.json();
    console.log(data);

    if(!data || data.length===0){
      alert("Data tidak ditemukan! Login ulang ya.");
      logout();
      return;
    }

    let m = data[0];
    document.getElementById('nama').innerText = m.nama || "-";
    document.getElementById('nisTampil').innerText = "NIS : " + m.nis;
    document.getElementById('kelas').innerText = m.kelas || "-";
    document.getElementById('mapel').innerText = m.mapel_favorit || "-";
    document.getElementById('wa').innerText = m.wa || "-";
    document.getElementById('alamat').innerText = m.alamat || "-";
    document.getElementById('status').innerText = m.status || "-";

    if(m.foto){
      document.getElementById('fotoBox').innerHTML = '<img src="'+m.foto+'">';
    }

    document.getElementById('loading').style.display='none';
    document.getElementById('isi').style.display='block';

  }catch(e){
    document.getElementById('loading').innerText = "Gagal ambil data: " + e;
  }
}

function logout(){
  localStorage.removeItem('nis_login');
  localStorage.removeItem('nama_login');
  location.href = 'login.html';
}
</script>
</body></html>
