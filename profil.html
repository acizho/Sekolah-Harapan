<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Sekolah - Luxury</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#000;color:#fff;min-height:100vh;padding:22px 16px 40px;background-image:radial-gradient(circle at 15% 10%, rgba(212,175,55,.22) 0%, transparent 40%),radial-gradient(circle at 90% 60%, rgba(212,175,55,.18) 0%, transparent 45%),linear-gradient(180deg,#14100a,#000 45%,#000)}
.header{text-align:center}
.header h1{color:#e8c97a;font-size:22px;letter-spacing:5px;font-weight:400}
.garis{width:180px;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:12px auto;position:relative}
.garis::after{content:"◆";position:absolute;left:50%;top:-8px;transform:translateX(-50%);color:#d4af37;font-size:10px;background:#000;padding:0 6px}
.foto{width:170px;height:170px;margin:22px auto 20px;border-radius:50%;border:4px solid #e8c97a;box-shadow:0 0 0 3px #7a5f1a,0 0 30px rgba(212,175,55,.6),inset 0 0 20px rgba(0,0,0,.7);background:radial-gradient(circle at 50% 35%, #2a2415, #000);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.foto span{font-size:52px}
.foto b{font-size:13px;margin-top:2px;color:#fff}
.foto small{font-size:12px;color:#e8c97a;max-width:130px;text-align:center}
.foto input{display:none}
.row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.7);border-radius:14px;padding:13px 15px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.row .icon{font-size:28px;width:38px;text-align:center}
.row .txt{flex:1}
.row .txt label{display:block;color:#e8c97a;font-size:15px;font-weight:700}
.row .txt input{background:transparent;border:none;outline:none;color:#fff;font-size:14px;width:100%;padding:2px 0}
.row .txt input::placeholder{color:#ccc}
.btn{width:100%;margin-top:8px;background:linear-gradient(180deg,#f5d67b,#d4af37,#a8831d);color:#000;border:none;padding:15px;border-radius:999px;font-weight:900;font-size:20px;letter-spacing:2px;cursor:pointer;box-shadow:0 10px 25px rgba(212,175,55,.4)}
.back{width:100%;margin-top:12px;background:transparent;border:1px solid #555;color:#aaa;padding:12px;border-radius:999px;cursor:pointer}
#status{position:fixed;bottom:16px;left:16px;right:16px;background:#14532d;padding:12px;text-align:center;border-radius:12px;display:none}
</style>
</head>
<body>
<div class="header"><h1>PROFIL SEKOLAH</h1><div class="garis"></div></div>

<label class="foto">
<span>🎓</span><b>Nama:</b><small id="namaDiFoto">[Nama Placeholder]</small>
<input type="file" accept="image/*" onchange="gantiFoto(event)">
<img id="imgFoto" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
</label>

<div class="row"><div class="icon">🪪</div><div class="txt"><label>NIP / NIS:</label><input id="fNip" placeholder="[NIS Placeholder]"></div></div>
<div class="row"><div class="icon">🎓</div><div class="txt"><label>Kelas:</label><input id="fKelas" placeholder="[Kelas Placeholder]"></div></div>
<div class="row"><div class="icon">📖</div><div class="txt"><label>Mata Pelajaran:</label><input id="fMapel" placeholder="[Mata Pelajaran Placeholder]"></div></div>
<div class="row"><div class="icon">📞</div><div class="txt"><label>No WA:</label><input id="fWa" placeholder="[+62 • • • • • • • •]"></div></div>
<div class="row"><div class="icon">📍</div><div class="txt"><label>Alamat:</label><input id="fAlamat" placeholder="[Alamat Placeholder]"></div></div>
<div class="row"><div class="icon">☀️</div><div class="txt"><label>Status:</label><input id="fStatus" placeholder="[Siswa Aktif Placeholder]"></div></div>

<!-- input nama tersembunyi buat update nama di lingkaran -->
<input id="fNama" placeholder="Ketik Nama di sini..." oninput="document.getElementById('namaDiFoto').innerText=this.value||'[Nama Placeholder]'" style="width:100%;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:12px;margin-bottom:12px">

<button class="btn" onclick="simpan()">SIMPAN</button>
<button class="back" onclick="location.href='as7.html'">⬅ Kembali ke Admin</button>
<div id="status"></div>
<script>
function gantiFoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(){let im=document.getElementById('imgFoto');im.src=r.result;im.style.display='block';localStorage.setItem('fotoProfil',r.result)};r.readAsDataURL(f)}
function simpan(){let d={nama:document.getElementById('fNama').value,nip:document.getElementById('fNip').value,kelas:document.getElementById('fKelas').value,mapel:document.getElementById('fMapel').value,wa:document.getElementById('fWa').value,alamat:document.getElementById('fAlamat').value,status:document.getElementById('fStatus').value};localStorage.setItem('profilLuxury',JSON.stringify(d));let s=document.getElementById('status');s.innerText='✅ Tersimpan!';s.style.display='block';setTimeout(()=>s.style.display='none',3000)}
let saved=JSON.parse(localStorage.getItem('profilLuxury')||'{}');if(saved.nama){document.getElementById('fNama').value=saved.nama;document.getElementById('namaDiFoto').innerText=saved.nama}if(saved.nip)document.getElementById('fNip').value=saved.nip;if(saved.kelas)document.getElementById('fKelas').value=saved.kelas;if(saved.mapel)document.getElementById('fMapel').value=saved.mapel;if(saved.wa)document.getElementById('fWa').value=saved.wa;if(saved.alamat)document.getElementById('fAlamat').value=saved.alamat;if(saved.status)document.getElementById('fStatus').value=saved.status;let foto=localStorage.getItem('fotoProfil');if(foto){let im=document.getElementById('imgFoto');im.src=foto;im.style.display='block'}
</script>
</body>
</html>
