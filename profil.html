<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Sekolah</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#000;color:#fff;min-height:100vh;padding:22px 16px 40px;background-image:radial-gradient(circle at 15% 10%, rgba(212,175,55,.22) 0%, transparent 40%),linear-gradient(180deg,#14100a,#000 45%,#000)}
.header{text-align:center}.header h1{color:#e8c97a;font-size:22px;letter-spacing:5px;font-weight:400}
.garis{width:180px;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:12px auto;position:relative}
.garis::after{content:"◆";position:absolute;left:50%;top:-8px;transform:translateX(-50%);color:#d4af37;font-size:10px;background:#000;padding:0 6px}
.foto{width:170px;height:170px;margin:22px auto 10px;border-radius:50%;border:4px solid #e8c97a;box-shadow:0 0 0 3px #7a5f1a,0 0 30px rgba(212,175,55,.6);background:radial-gradient(circle at 50% 35%, #2a2415, #000);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.foto span{font-size:52px}.foto small{font-size:12px;color:#e8c97a;max-width:130px;text-align:center;z-index:2}
.nama-atas{text-align:center;margin-bottom:20px}.nama-atas h2{font-size:24px;font-weight:900}.nama-atas p{color:#e8c97a;font-size:13px;margin-top:3px}
.row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.7);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.row .icon{font-size:28px;width:38px;text-align:center}.row .txt{flex:1}.row .txt label{display:block;color:#e8c97a;font-size:14px;font-weight:700}.row .txt div{font-size:15px;margin-top:2px}
.gedung{margin-top:22px;border:1px solid #d4af37;border-radius:18px;overflow:hidden;position:relative;cursor:pointer;background:#111}
.gedung img{width:100%;height:180px;object-fit:cover;display:block}
.gedung .overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85));display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.gedung .overlay b{font-size:18px}.gedung .overlay span{color:#e8c97a;font-size:13px;margin-top:2px}
.gedung .tap{position:absolute;top:12px;right:12px;background:#e8c97a;color:#000;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px}
.btn{width:100%;margin-top:18px;background:linear-gradient(180deg,#f5d67b,#d4af37,#a8831d);color:#000;border:none;padding:15px;border-radius:999px;font-weight:900;font-size:18px;cursor:pointer}
.back{width:100%;margin-top:12px;background:transparent;border:1px solid #555;color:#aaa;padding:12px;border-radius:999px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;z-index:99}
.modal.show{display:flex}.modal-box{width:100%;max-width:480px;background:#14100a;border-top:2px solid #d4af37;border-radius:22px 22px 0 0;padding:22px 18px 30px}
.modal-box h3{color:#e8c97a;font-size:19px;text-align:center}.modal-box p{text-align:center;color:#aaa;font-size:13px;margin:6px 0 16px}
.mapel-item{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.5);border-radius:12px;padding:12px;margin-bottom:10px}
.mapel-item .jam{background:#e8c97a;color:#000;font-weight:800;font-size:12px;padding:6px 10px;border-radius:8px;min-width:92px;text-align:center}
.mapel-item b{font-size:15px}.mapel-item small{display:block;color:#aaa;font-size:12px}
.close{width:100%;margin-top:10px;background:transparent;border:1px solid #555;color:#fff;padding:12px;border-radius:999px}
</style>
</head>
<body>
<div class="header"><h1>PROFIL SEKOLAH</h1><div class="garis"></div></div>
<div class="foto"><img id="imgFoto"><span>🎓</span><small id="namaFoto">Memuat...</small></div>
<div class="nama-atas"><h2 id="namaBesar">Memuat...</h2><p id="kelasBesar">Memuat...</p></div>
<div class="row"><div class="icon">🪪</div><div class="txt"><label>NIP / NIS:</label><div id="vNip">-</div></div></div>
<div class="row"><div class="icon">🎓</div><div class="txt"><label>Kelas:</label><div id="vKelas">-</div></div></div>
<div class="row"><div class="icon">📖</div><div class="txt"><label>Mata Pelajaran Favorit:</label><div id="vMapel">-</div></div></div>
<div class="row"><div class="icon">📞</div><div class="txt"><label>No WA:</label><div id="vWa">-</div></div></div>
<div class="row"><div class="icon">📍</div><div class="txt"><label>Alamat:</label><div id="vAlamat">-</div></div></div>
<div class="row"><div class="icon">☀️</div><div class="txt"><label>Status:</label><div id="vStatus">-</div></div></div>
<div class="gedung" onclick="bukaMapel()"><div class="tap">👆 KLIK UNTUK LIHAT MAPEL</div><img src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=800&q=80"><div class="overlay"><b>🏫 Gedung Sekolah</b><span id="besokLabel">Mapel Besok - Memuat...</span></div></div>
<button class="btn" onclick="bukaMapel()">📖 LIHAT MAPEL BESOK</button>
<button class="back" onclick="location.href='index.html'">⬅ Kembali ke Beranda</button>
<div class="modal" id="modalMapel" onclick="if(event.target===this) tutupMapel()"><div class="modal-box"><h3>📖 Mata Pelajaran Besok</h3><p id="tanggalBesok">-</p><div id="listMapel"></div><button class="close" onclick="tutupMapel()">Tutup</button></div></div>
<script>
const SUPABASE_URL = "https://rotxnwbrnbwbscihvafq.supabase.co/rest/v1";
const SUPABASE_KEY = "sb_publishable_a-oUmMa2TdwiWO_hbZ07eA_8F93XM81";
let DATA_PROFIL = null; let DATA_JADWAL = [];
async function ambilDariSupabase(){
try{
let r1 = await fetch(SUPABASE_URL + "/murid?select=*&limit=1", {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
let a1 = await r1.json(); DATA_PROFIL = a1[0];
let r2 = await fetch(SUPABASE_URL + "/jadwal?select=*&order=jam", {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
DATA_JADWAL = await r2.json();
tampilProfil();
}catch(e){ document.getElementById('namaBesar').innerText = "Gagal load database"; }
}
function tampilProfil(){
const d = DATA_PROFIL; if(!d) return;
document.getElementById('namaFoto').innerText = d.nama;
document.getElementById('namaBesar').innerText = d.nama;
document.getElementById('kelasBesar').innerText = d.kelas + " • " + d.status;
document.getElementById('vNip').innerText = d.nis;
document.getElementById('vKelas').innerText = d.kelas;
document.getElementById('vMapel').innerText = d.mapel_favorit;
document.getElementById('vWa').innerText = d.wa;
document.getElementById('vAlamat').innerText = d.alamat;
document.getElementById('vStatus').innerText = d.status;
if(d.foto){ let im=document.getElementById('imgFoto'); im.src=d.foto; im.style.display='block'; }
let besok = new Date(); besok.setDate(besok.getDate()+1);
let hariBesok = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"][besok.getDay()];
document.getElementById('besokLabel').innerText = "Mapel Besok - " + hariBesok + " • Klik untuk lihat";
}
function bukaMapel(){
let besok = new Date(); besok.setDate(besok.getDate()+1);
let hariBesok = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"][besok.getDay()];
let tgl = besok.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
document.getElementById('tanggalBesok').innerText = hariBesok + ", " + tgl;
let list = DATA_JADWAL.filter(j => j.hari === hariBesok);
let html = "";
if(list.length===0) html = "<p style='text-align:center;padding:20px'>Libur! Tidak ada mapel besok 🎉</p>";
else list.forEach(m=>{ html += `<div class="mapel-item"><div class="jam">${m.jam}</div><div><b>${m.mapel}</b><small>${m.guru}</small></div></div>` });
document.getElementById('listMapel').innerHTML = html;
document.getElementById('modalMapel').classList.add('show');
}
function tutupMapel(){ document.getElementById('modalMapel').classList.remove('show'); }
ambilDariSupabase();
</script>
</body>
</html>
