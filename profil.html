<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login Siswa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;text-align:center}
.box h1{color:#e8c97a;letter-spacing:4px;font-size:22px}
.box p{color:#aaa;font-size:13px;margin:10px 0 22px}
input{width:100%;background:#111;border:1px solid #d4af37;color:#fff;padding:15px;border-radius:14px;font-size:18px;text-align:center;outline:none;margin-bottom:12px;letter-spacing:4px}
button{width:100%;background:linear-gradient(180deg,#f5d67b,#d4af37,#a8831d);border:none;padding:15px;border-radius:999px;font-weight:900;font-size:18px;cursor:pointer;margin-bottom:10px}
#err{color:#ff6b6b;font-size:13px;margin-top:6px;display:none}
label{display:block;text-align:left;color:#e8c97a;font-size:13px;font-weight:700;margin-bottom:6px}
.pin-box{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.pin-box input{width:52px;height:58px;font-size:26px;padding:0;text-align:center}
.kembali{font-size:13px;color:#aaa;cursor:pointer;margin-top:8px}
</style></head><body>
<div class="box">
<div style="font-size:60px">🎓</div><h1>LOGIN SISWA</h1><p id="sub">Masukkan NIS kamu</p>

<!-- LANGKAH 1: NIS -->
<div id="step1">
<label>NIS</label>
<input id="nis" placeholder="Contoh: 202401234" inputmode="numeric">
<button onclick="cekNis()">LANJUT ➜</button>
</div>

<!-- LANGKAH 2: PIN 6 DIGIT - MUNCUL KALAU NIS BENER -->
<div id="step2" style="display:none">
<label>MASUKKAN PIN 6 DIGIT</label>
<p id="namaKetemu" style="color:#e8c97a;font-size:14px;margin-bottom:12px"></p>
<div class="pin-box">
<input id="p1" maxlength="1" inputmode="numeric" oninput="pindah(this,'p2')">
<input id="p2" maxlength="1" inputmode="numeric" oninput="pindah(this,'p3')">
<input id="p3" maxlength="1" inputmode="numeric" oninput="pindah(this,'p4')">
<input id="p4" maxlength="1" inputmode="numeric" oninput="pindah(this,'p5')">
<input id="p5" maxlength="1" inputmode="numeric" oninput="pindah(this,'p6')">
<input id="p6" maxlength="1" inputmode="numeric" oninput="cekPinOtomatis()">
</div>
<button onclick="loginPin()">MASUK ➜</button>
<div class="kembali" onclick="keStep1()">⬅ Ganti NIS</div>
</div>

<div id="err"></div></div>
<script>
const SUPABASE_URL = "https://rotxnwbrnbwbscihvafq.supabase.co/rest/v1";
const SUPABASE_KEY = "sb_publishable_a-oUmMa2TdwiWO_hbZ07eA_8F93XM81";
let nisValid = "";

function pindah(el, next){ if(el.value) document.getElementById(next).focus(); }
function cekPinOtomatis(){ let pin = ambilPin(); if(pin.length===6) loginPin(); }
function ambilPin(){ return ['p1','p2','p3','p4','p5','p6'].map(id=>document.getElementById(id).value).join(''); }
function showErr(msg){ let e=document.getElementById('err'); e.innerText=msg; e.style.display='block'; }
function hideErr(){ document.getElementById('err').style.display='none'; }

async function cekNis(){
  let nis = document.getElementById('nis').value.trim();
  if(!nis) return alert("Isi NIS dulu!");
  hideErr();
  // Cek NIS doang dulu, belum cek PIN
  let r = await fetch(SUPABASE_URL + "/murid?select=nama,nis&nis=eq." + nis, {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
  let data = await r.json();
  if(data.length===0){ showErr("❌ NIS tidak ditemukan!"); return; }
  // NIS BENER -> MUNCULKAN PIN 6 DIGIT
  nisValid = nis;
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('sub').innerText = "NIS ditemukan!";
  document.getElementById('namaKetemu').innerText = "Halo, " + data[0].nama + " 👋";
  document.getElementById('p1').focus();
}

async function loginPin(){
  let pin = ambilPin();
  if(pin.length!==6){ showErr("❌ PIN harus 6 digit!"); return; }
  let r = await fetch(SUPABASE_URL + "/murid?select=*&nis=eq." + nisValid + "&pin=eq." + pin, {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
  let data = await r.json();
  if(data.length===0){ showErr("❌ PIN salah! Coba lagi."); ['p1','p2','p3','p4','p5','p6'].forEach(id=>document.getElementById(id).value=''); document.getElementById('p1').focus(); return; }
  localStorage.setItem('nis_login', nisValid);
  localStorage.setItem('nama_login', data[0].nama);
  location.href = 'profil.html';
}

function keStep1(){
  document.getElementById('step2').style.display='none';
  document.getElementById('step1').style.display='block';
  document.getElementById('sub').innerText = "Masukkan NIS kamu";
  hideErr();
}
</script></body></html>
