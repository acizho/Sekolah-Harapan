<!-- TOMBOL CEK DEBUG - HAPUS LAGI KALO UDAH KETEMU -->
<button onclick="cekDebug()" style="position:fixed;top:10px;right:10px;z-index:9999;background:red;color:#fff;border:none;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:bold;">CEK SALAHNYA</button>
<div id="boxDebug" style="display:none;position:fixed;inset:10px;background:#000;border:2px solid red;border-radius:16px;padding:16px;z-index:10000;overflow-y:auto;font-size:12px;line-height:1.6;"></div>

<script>
async function cekDebug(){
  let box = document.getElementById('boxDebug');
  box.style.display = 'block';
  box.innerHTML = '⏳ Lagi ngecek...';
  
  let kelasSiswa = dataSiswaLogin && dataSiswaLogin.kelas ? dataSiswaLogin.kelas.nama_kelas : 'KOSONG!';
  let nis = nisLogin;

  // Ambil data mentah dari Supabase
  let g = await supabaseClient.from('guru').select('*');
  let m = await supabaseClient.from('materi').select('*');
  let s = await supabaseClient.from('siswa').select('*,kelas(nama_kelas)').eq('nis', nis).single();

  let html = `<button onclick="document.getElementById('boxDebug').style.display='none'" style="background:red;color:#fff;border:none;padding:10px;border-radius:12px;width:100%;margin-bottom:12px;">TUTUP ✕</button>`;
  html += `<h3 style="color:#d4af37;">1. SISWA ANDI</h3>`;
  html += `Nama: ${s.data?.nama}<br>NIS: ${s.data?.nis}<br>Kelas di DB: <b style="color:yellow;">${s.data?.kelas?.nama_kelas || s.data?.kelas_id || 'KOSONG'}</b><br>kelas_id: ${s.data?.kelas_id}<br><br>`;

  html += `<h3 style="color:#d4af37;">2. SEMUA GURU (Yang kebaca)</h3>`;
  html += (g.data||[]).map(x=>`• @${x.nama} | mapel: ${x.mapel} | kelas: <b>${x.kelas || x.mengajar_kelas || 'KOSONG!'}</b>`).join('<br>') + '<br><br>';

  html += `<h3 style="color:#d4af37;">3. SEMUA MATERI (Yang kebaca)</h3>`;
  html += (m.data||[]).map(x=>`• ${x.judul} | mapel: ${x.mapel} | kelas: <b>${x.kelas || x.kelas_nama || 'KOSONG!'}</b> | guru: ${x.guru}`).join('<br>') + '<br><br>';

  html += `<h3 style="color:red;">KESIMPULAN:</h3>`;
  html += `Kalo di no 2 ada guru Linear yang kelasnya KOSONG, berarti dia keambil semua karena filter kita yang lama nganggap KOSONG = SEMUA. Itu biang nyangkutnya!<br><br>`;
  html += `Kalo di no 3 ada materi Linear yang kelasnya KOSONG, sama! Materi itu gak punya kelas, jadi kebaca sama semua siswa, termasuk Andi X IPA 1!`;

  box.innerHTML = html;
}
</script>
