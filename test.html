<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  margin: 0;
  box-sizing: border-box;
}
body {
  font-family: sans-serif;
  background: #111;
  color: #fff;
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: #0a0a0a;
  border-bottom: 2px solid #e8c55a;
  position: sticky;
  top: 0;
  z-index: 10;
}
#btnMenu {
  font-size: 26px;
  background: none;
  border: 1px solid #e8c55a;
  color: #f7e8a0;
  padding: 4px 12px;
  border-radius: 8px;
  cursor: pointer;
}
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 260px;
  height: 100vh;
  background: #0a0a0a;
  border-right: 2px solid #e8c55a;
  padding: 20px;
  transform: translateX(-110%);
  transition: transform 0.3s ease;
  z-index: 20;
}
.sidebar.open {
  transform: translateX(0);
}
.sidebar h2 {
  color: #f7e8a0;
  margin-bottom: 16px;
}
.sidebar button {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 1px solid #e8c55a;
  color: #fff;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  z-index: 15;
}
#overlay.show {
  display: block;
}
.main {
  padding: 20px;
}
</style>
</head>
<body>

<header>
  <button id="btnMenu">☰</button>
  <h3>SMA NEGERI 1</h3>
</header>

<div class="sidebar" id="sidebar">
  <h2>MENU</h2>
  <button>Dashboard</button>
  <button>PPDB</button>
  <button>Data Siswa</button>
  <button>Kas / SPP</button>
</div>

<div id="overlay"></div>

<div class="main">
  <h1>Ini Konten</h1>
  <p>Pencet tombol garis 3 di atas.</p>
  <p>Menu bakal ngesot dari kiri.</p>
  <p>Pencet lagi / pencet area gelap buat nutup.</p>
</div>

<script>
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const btn = document.getElementById('btnMenu');

btn.onclick = function() {
  sidebar.classList.add('open');
  overlay.classList.add('show');
};

overlay.onclick = function() {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
};
</script>

</body>
</html>
